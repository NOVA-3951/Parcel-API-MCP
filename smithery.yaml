startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - parcelApiKey
    properties:
      parcelApiKey:
        type: string
        description: Your Parcel API key from web.parcelapp.net
  commandFunction: |-
    (config) => {
      const configBase64 = Buffer.from(JSON.stringify(config)).toString('base64');
      return {
        command: 'node',
        args: ['./dist/index.js', '--config', configBase64]
      };
    }
  exampleConfig:
    parcelApiKey: "your-parcel-api-key"
